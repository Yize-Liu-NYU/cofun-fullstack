[nosetests]
verbosity = 2
detailed-errors = 1
with-coverage = false
cover-erase = true
cover-package = cofun

# Babel configuration
[compile_catalog]
domain = cofun
directory = cofun/i18n
statistics = true

[extract_messages]
add_comments = TRANSLATORS:
output_file = cofun/i18n/cofun.pot
width = 80
keywords = l_

[init_catalog]
domain = cofun
input_file = cofun/i18n/cofun.pot
output_dir = cofun/i18n

[update_catalog]
domain = cofun
input_file = cofun/i18n/cofun.pot
output_dir = cofun/i18n
previous = true

# Static files extraction for TW
[archive_tw_resources]
output = cofun/public/toscawidgets/
distributions = cofun
#yuicompressor = /home/someuser/bin/yuicompressor.jar
#compresslevel = 2
onepass = true

[archive_tw2_resources]
output = cofun/public/tw2/
distributions = cofun
force = true
#yuicompressor = /home/someuser/bin/yuicompressor.jar
#compresslevel = 2
onepass = true

[aliases]
# A handy alias to make a release to pypi
release = egg_info -RDb "" sdist bdist_egg register upload
